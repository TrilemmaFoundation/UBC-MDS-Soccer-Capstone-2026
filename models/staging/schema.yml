version: 2

models:
  - name: stg_statsbomb__matches
    columns:
      - name: match_id
        tests:
          - unique
          - not_null
      - name: match_result
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home_win', 'away_win', 'draw']
      - name: match_date
        tests:
          - not_null
      - name: competition_id
        tests:
          - not_null

  - name: stg_statsbomb__events
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
      - name: match_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_statsbomb__matches')
              field: match_id
      - name: event_type
        tests:
          - not_null

  - name: stg_statsbomb__lineups
    columns:
      - name: player_id
        tests:
          - not_null
      - name: match_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_statsbomb__matches')
              field: match_id

  - name: stg_polymarket__markets
    columns:
      - name: market_id
        tests:
          - unique
          - not_null
      - name: event_slug
        tests:
          - not_null
      - name: volume_usd
        tests:
          - not_null

  - name: stg_polymarket__odds_history
    columns:
      - name: market_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_polymarket__markets')
              field: market_id
      - name: token_id
        tests:
          - not_null
      - name: recorded_at
        tests:
          - not_null
      - name: implied_probability
        tests:
          - not_null

  - name: stg_polymarket__event_stats
    columns:
      - name: event_slug
        tests:
          - unique
          - not_null
      - name: total_volume_usd
        tests:
          - not_null
      - name: market_count
        tests:
          - not_null