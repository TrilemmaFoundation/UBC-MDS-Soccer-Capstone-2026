models:
  - name: int_match_stats
    description: "Team-level match statistics including xG, passing accuracy, and possession share."
    columns:
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_statsbomb__matches')
                field: match_id
      - name: possession_share
        description: "Proxy for possession based on pass volume relative to opponent."
        tests:
          - not_null

  - name: int_player_match_stats
    description: "Player-level match statistics used for archetype clustering and performance analysis."
    columns:
      - name: player_id
        tests:
          - not_null
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_statsbomb__matches')
                field: match_id
      # Added Match-level Feature Documentations
      - name: dribbles
        description: "Total raw dribble events attempted by the player during the match."
      - name: clearances
        description: "Total raw clearance events executed by the player during the match."
      - name: duels
        description: "Total raw defensive, aerial, or ground duel events contested by the player during the match."
      - name: carries_att_third
        description: "Total ball carries executed by the player where the event started in the attacking third (location_x > 80)."
      - name: passes_att_third
        description: "Total passes attempted by the player where the event originated in the attacking third (location_x > 80)."
      - name: blocks
        description: "Total raw shot or pass block events executed by the player during the match."
      - name: ball_recoveries
        description: "Total raw ball recovery events registered by the player during the match."
      - name: fouls
        description: "Total raw fouls committed by the player during the match."

  - name: int_player_season_stats
    description: "Aggregated player statistics per competition season, normalized per 90 minutes. Filters for players with at least 450 minutes."
    columns:
      - name: player_id
        tests:
          - not_null
      - name: total_minutes
        description: "Cumulative minutes played in the season."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 450
      - name: xg_per_shot
        description: "Expected goals per individual shot attempt. Seasonal scoring efficiency metric."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      
      # Clustering pipeline features (cluster.py)
      - name: dribbles_per_90
        description: "Dribble events normalized per 90 minutes played. Required feature for the clustering model pipeline."
      - name: clearances_per_90
        description: "Clearance events normalized per 90 minutes played. Required feature for the clustering model pipeline."
      - name: carries_att_third_per_90
        description: "Attacking third ball carries normalized per 90 minutes played. Proxy vector for winger/forward line breaking progression."
      - name: passes_att_third_per_90
        description: "Attacking third passes normalized per 90 minutes played. Proxy vector for high-up territory possession retention."

      # Consistency pipeline features (Rabin Notebook 03)
      - name: blocks_per_90
        description: "Blocks completed normalized per 90 minutes played. Metric used to derive performance consistency bounds."
      - name: ball_recoveries_per_90
        description: "Ball recovery events normalized per 90 minutes played. Metric used to derive performance consistency bounds."
      - name: fouls_per_90
        description: "Fouls committed normalized per 90 minutes played. Metric used to derive performance consistency bounds."
      - name: duels_per_90
        description: "Total contested duels normalized per 90 minutes played. Metric used to derive performance consistency bounds."

  - name: int_team_season_stats
    description: "Seasonal aggregation of team performance including points, xG, and tactical proxies."
    columns:
      - name: team
        tests:
          - not_null
      - name: matches_played
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 10
      - name: total_points
        description: "Calculated points (W=3, D=1, L=0)."

  - name: int_team_rolling_form
    description: "5-match rolling averages of tactical and performance metrics to be used as features for match outcome prediction."
    columns:
      - name: rolling_avg_xg
        description: "Average xG generated over the team's previous 5 matches."
      - name: rolling_avg_points
        description: "Average points earned (Form) over the team's previous 5 matches."

  - name: int_match_features
    description: "The finalized feature matrix for the match outcome prediction model, combining rolling form and historical H2H data."
    columns:
      - name: match_id
        tests:
          - unique
          - not_null
      - name: competition_id
        description: "Unique identifier for the competition, mapped down from staging to allow clustering configurations on target marts."
        tests:
          - not_null
      - name: h2h_home_win_pct
        description: "The percentage of previous encounters won by the current home team."