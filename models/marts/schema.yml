models:
  - name: mart_match_analysis
    description: "Comprehensive match-level analytics including scores, xG, and team performance metrics. Primary source for the Match Overview dashboard."
    columns:
      - name: match_id
        description: "Unique identifier for each match."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_statsbomb__matches')
                field: match_id

      - name: match_date
        description: "The date when the match was played. Used as the table partition key."
        tests:
          - not_null

      - name: competition_id
        description: "Unique identifier for the competition. Used as a cluster key."
        tests:
          - not_null

      - name: competition_name
        description: "The name of the competition (e.g., La Liga, World Cup)."

      - name: season_id
        description: "Unique identifier for the specific season."

      - name: season_name
        description: "The name or year designation of the season."

      - name: home_team
        description: "Name of the home team."
        tests:
          - not_null

      - name: away_team
        description: "Name of the away team."
        tests:
          - not_null

      - name: home_score
        description: "Goals scored by the home team."
        tests:
          - not_null

      - name: away_score
        description: "Goals scored by the away team."
        tests:
          - not_null

      - name: match_result
        description: "The final outcome of the match relative to the venues ('home_win', 'away_win', or 'draw')."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home_win', 'away_win', 'draw']

      # Home Team Performance Metrics
      - name: home_xg
        description: "Total Expected Goals (xG) generated by the home team during the match."

      - name: home_possession_proxy
        description: "Proxy for possession share based on the home team's pass volume relative to total match passes. Can be NULL if a team records no event data."

      - name: home_pass_completion_pct
        description: "Percentage of passes completed successfully by the home team."

      - name: home_shots
        description: "Total number of shots taken by the home team."

      - name: home_total_pressures
        description: "Total defensive pressure events applied by the home team."

      - name: home_total_carries
        description: "Total ball carries executed by the home team."

      # Away Team Performance Metrics
      - name: away_xg
        description: "Total Expected Goals (xG) generated by the away team during the match."

      - name: away_possession_proxy
        description: "Proxy for possession share based on the away team's pass volume relative to total match passes. Can be NULL if a team records no event data."

      - name: away_pass_completion_pct
        description: "Percentage of passes completed successfully by the away team."

      - name: away_shots
        description: "Total number of shots taken by the away team."

      - name: away_total_pressures
        description: "Total defensive pressure events applied by the away team."

      - name: away_total_carries
        description: "Total ball carries executed by the away team."

  - name: mart_player_performance
    description: "Detailed player-level seasonal and match statistics combined with ML-generated tactical archetypes. Used for analyzing individual contributions and player scouting."
    columns:
      - name: player_id
        description: "Unique identifier for the player."
        tests:
          - not_null
      - name: player_name
        description: "Full name of the player."
        tests:
          - not_null
      - name: competition_id
        description: "Unique identifier for the competition season."
        tests:
          - not_null
      - name: season_id
        description: "Unique identifier for the season."
        tests:
          - not_null
      - name: total_minutes
        description: "Cumulative minutes played across the season. Filtered for a minimum threshold of 270 minutes."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 270
      - name: cluster_id
        description: "The numerical cluster group index generated by the machine learning algorithm. Defaults to -1 if unassigned."
        tests:
          - not_null
      - name: cluster_label
        description: "The tactical text archetype string matching the cluster ID assignment (e.g., 'Pressing Forward', 'Creative Playmaker')."
        tests:
          - not_null

      - name: club_performance_score
        description: "The aggregated performance score calculated based on PCA feature weights for club matches."

      - name: national_performance_score
        description: "The aggregated performance score calculated based on PCA feature weights for national team matches."

      - name: consistency_score
        description: "The consistency score representing the gap between club and national match performances (1 - mean absolute difference)."

      - name: performance_quadrant
        description: "Categorical quadrant indicating the player's performance alignment across club and international contexts."
        tests:
          - accepted_values:
              arguments:
                values: 
                  - 'Elite'
                  - 'Club Specialist'
                  - 'International Specialist'
                  - 'Underperformer'

  - name: mart_player_clusters
    description: "Player seasonal performance profiles combined with cluster assignments from the BigQuery analytics warehouse. Formulated with dimensional coordinates for 2D visualization components and raw parameters for performance profile heatmaps."
    columns:
      # Player & Season Keys
      - name: player_id
        description: "Unique identifier for the player."
        tests:
          - not_null
      - name: player_name
        description: "Full name of the player."
        tests:
          - not_null
      - name: competition_id
        description: "Unique identifier for the competition."
        tests:
          - not_null
      - name: season_id
        description: "Unique identifier for the season."
        tests:
          - not_null
      - name: total_minutes
        description: "Total seasonal minutes played. Strictly restricted to players passing the standard statistical validation threshold (>= 270 minutes)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 270

      # Clustering Output Fields
      - name: cluster_id
        description: "The numerical cluster profile index generated by the machine learning engine (0 through 4). Defaults to -1 if unassigned."
        tests:
          - not_null
      - name: cluster_label
        description: "The descriptive tactical archetype assignment text label mapped directly from the K-Means groupings."
        tests:
          - not_null

      # Dimensional Visual Layout Coordinates
      - name: pc1
        description: "Derived Principal Component 1 score (horizontal coordinate) calculated via dot product of z-scored player features against BigQuery PCA loadings."
      - name: pc2
        description: "Derived Principal Component 2 score (vertical coordinate) calculated via dot product of z-scored player features against BigQuery PCA loadings."

      # Exact 11 Features for Clustering Parity & Radar Chart Heatmaps (Aligned to _per_90)
      - name: shots_per_90
        description: "Shots taken normalized per 90 minutes played."
      - name: xg_per_90
        description: "Expected Goals (xG) generated normalized per 90 minutes played."
      - name: xg_per_shot
        description: "Expected goals per individual shot attempt. Seasonal scoring quality metric."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: dribbles_per_90
        description: "Dribbles attempted normalized per 90 minutes played."
      - name: carries_att_third_per_90
        description: "Ball carries starting in the attacking third normalized per 90 minutes played."
      - name: passes_att_third_per_90
        description: "Passes originating in the attacking third normalized per 90 minutes played."
      - name: pass_completion_pct
        description: "Seasonal pass completion accuracy ratio (completed passes divided by attempted passes)."
      - name: pressures_per_90
        description: "Defensive pressure instances executed normalized per 90 minutes played."
      - name: interceptions_per_90
        description: "Interceptions completed normalized per 90 minutes played."
      - name: clearances_per_90
        description: "Clearance events normalized per 90 minutes played."
      - name: duels_per_90
        description: "All contested ground and aerial duels normalized per 90 minutes played."

      # Supplementary Traditional Metrics
      - name: goals_per_90
        description: "Goals scored normalized per 90 minutes played."
      - name: assists_per_90
        description: "Assists registered normalized per 90 minutes played."

  - name: mart_team_comparison
    description: "Aggregated team metrics allowing for head-to-head tactical comparisons across leagues and seasons. Combines historical season baseline metrics with final rolling performance proxies."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team
            - competition_id
            - season_id
    columns:
      # Key Identifiers
      - name: team
        description: "The name of the football club."
        tests:
          - not_null
      - name: competition_id
        description: "Unique identifier matching the competition league."
        tests:
          - not_null
      - name: season_id
        description: "Unique identifier matching the active campaign year."
        tests:
          - not_null
      - name: matches_played
        description: "Total appearances logged inside the season timeline. Filtered for a minimum threshold of 10 matches."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 10

      # Long-Term Metrics Baselines
      - name: seasonal_avg_xg
        description: "The team's average expected goals generated per match over the course of the full season."
      - name: seasonal_avg_possession
        description: "The team's average estimated possession share across the full season timeline."

      # Short-Term Momentum Figures
      - name: latest_rolling_xg
        description: "The average expected goals (xG) generated over the team's final 5 matches of the season."

      - name: latest_rolling_possession
        description: "The average estimated possession share controlled over the team's final 5 matches of the season."

  - name: mart_match_prediction_features
    description: "The official feature matrix used for match outcome prediction models (e.g., XGBoost training and scoring). Combines 5-match team rolling tactical form with historical head-to-head records."
    columns:
      # Keys and Target Labels
      - name: match_id
        description: "Primary key. Unique identifier matching individual matches."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_statsbomb__matches')
                field: match_id
      - name: competition_id
        description: "Competition identifier, cast from staging to support partitioning on mart tables."
        tests:
          - not_null
      - name: match_result
        description: "The categorical target outcome variable ('home_win', 'away_win', or 'draw') used as classification labels."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home_win', 'away_win', 'draw']

      # Home Tactical Proxies
      - name: home_rolling_xg
        description: "Average expected goals generated by the home team over their previous 5 matches."
      - name: home_rolling_points
        description: "Average points earned (form metric) by the home team over their previous 5 matches."

      # Away Tactical Proxies
      - name: away_rolling_xg
        description: "Average expected goals generated by the away team over their previous 5 matches."
      - name: away_rolling_points
        description: "Average points earned (form metric) by the away team over their previous 5 matches."

      # Head-to-Head Analytics
      - name: h2h_home_win_pct
        description: "The historical percentage of previous encounters won by the current home team against this specific opponent."