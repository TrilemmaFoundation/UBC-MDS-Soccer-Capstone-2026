name: Update conda-lock file

on:
  push:
    branches: [ main ]
    paths:
      - "environment.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_lock_file:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          create-args: ""
          init-shell: bash

      - name: Install conda-lock
        run: |
          pip install conda-lock

      - name: Generate updated lock file
        run: |
          # Changed -p linux-64 to -p linux-aarch64
          conda-lock -k explicit --file environment.yml -p linux-aarch64 --virtual-package-spec "cuda=none"

      - name: Commit & push the new lock file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Updated filename to reflect the ARM architecture
          git add conda-linux-aarch64.lock
          git commit -m "Update conda-lock file (ARM) after environment.yml change"
          git push