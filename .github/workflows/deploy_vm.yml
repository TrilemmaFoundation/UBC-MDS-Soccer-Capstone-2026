name: Deploy docker image to GCE VM

on:
  workflow_run:
    workflows: ["Publish Docker Images"]
    types: [completed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}

      - name: Add VM to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.GCE_VM_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare and Copy Configuration Files
        run: |
          cp .env.example .env
          sed -i 's|^GOOGLE_APPLICATION_CREDENTIALS=.*|GOOGLE_APPLICATION_CREDENTIALS=/app/service-account-key.json|' .env
          sed -i 's|^GROQ_API_KEY=.*|GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}|' .env
          echo '${{ secrets.GCE_SERVICE_ACCOUNT_KEY }}' > service-account-key.json

          # Copy configuration files AND the docker-compose.yml to the host filesystem
          scp .env service-account-key.json docker-compose.yml ${{ secrets.GCE_VM_USER }}@${{ secrets.GCE_VM_HOST }}:~/

      - name: Deploy Cluster on GCE VM
        run: |
          ssh ${{ secrets.GCE_VM_USER }}@${{ secrets.GCE_VM_HOST }} << 'EOF'
            set -e
            
            # Spin down running stacks to protect resource memory allotments
            sudo docker compose down || true
            sudo docker image prune -a -f

            # Extract and source values from our secure local environment file
            export $(cat $HOME/.env | xargs)

            # Pull and deploy using the updated compose configuration file
            sudo docker compose pull
            sudo docker compose up -d
          EOF