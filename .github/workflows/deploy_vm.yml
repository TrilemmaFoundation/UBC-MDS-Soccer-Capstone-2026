name: Deploy docker image to GCE VM

on:
  workflow_run:
    workflows: ["Publish Docker image"]
    types: [completed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: mdssoccer2026/ubc-mds-soccer-capstone-2026
  CONTAINER_NAME: soccer-capstone-app
  VM_PORT: 80
  CONTAINER_PORT: 8000

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}

      - name: Add VM to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.GCE_VM_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare and Copy Configuration Files
        run: |
          # 1. Create a working copy from .env.example, naming it .env locally
          cp .env.example .env

          # 2. Swap out the credentials path to point to the secure location inside the container
          sed -i 's|^GOOGLE_APPLICATION_CREDENTIALS=.*|GOOGLE_APPLICATION_CREDENTIALS=/app/service-account-key.json|' .env

          # 3. Inject your secret GROQ API key into the .env file
          sed -i 's|^GROQ_API_KEY=.*|GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}|' .env

          # 4. Write the service account JSON out to its own file
          echo '${{ secrets.GCE_SERVICE_ACCOUNT_KEY }}' > service-account-key.json

          # 5. Securely copy both files directly to your GCE VM's home directory as .env and service-account-key.json
          scp .env service-account-key.json ${{ secrets.GCE_VM_USER }}@${{ secrets.GCE_VM_HOST }}:~/

      - name: Deploy on GCE VM
        run: |
          ssh ${{ secrets.GCE_VM_USER }}@${{ secrets.GCE_VM_HOST }} << 'EOF'
            set -e
            
            # Stop and remove existing container first to maximize disk headroom
            sudo docker stop soccer-capstone-app || true
            sudo docker rm soccer-capstone-app || true
            
            # Clean up older images before pulling the massive new data science layer
            sudo docker image prune -a -f

            # Pull the latest ARM64 image build
            sudo docker pull mdssoccer2026/ubc-mds-soccer-capstone-2026:latest

            # Run the container using the newly pushed $HOME/.env file
            sudo docker run -d \
              --name soccer-capstone-app \
              --restart unless-stopped \
              -p 80:8000 \
              -p 8888:8888 \
              --env-file $HOME/.env \
              -v $HOME/service-account-key.json:/app/service-account-key.json \
              mdssoccer2026/ubc-mds-soccer-capstone-2026:latest
          EOF