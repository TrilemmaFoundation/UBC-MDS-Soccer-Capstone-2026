name: Deploy docker image to GCE VM

on:
  workflow_run:
    workflows: ["Publish Docker Images"]
    types: [completed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}

      - name: Add VM to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.GCE_VM_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare and Copy Configuration Files
        run: |
          cp .env.example .env
          sed -i 's|^GROQ_API_KEY=.*|GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}|' .env
          echo '${{ secrets.GCE_CHATBOT_SERVICE_ACCOUNT_KEY }}' > chatbot-service-account-key.json
          echo '${{ secrets.GCE_DAGSTER_SERVICE_ACCOUNT_KEY }}' > dagster-service-account-key.json

          # 1. Clean up previously locked files to avoid scp permission denied
          ssh ${{ secrets.GCE_VM_USER }}@${{ secrets.GCE_VM_HOST }} "sudo rm -f ~/.env ~/chatbot-service-account-key.json ~/dagster-service-account-key.json ~/docker-compose.yml ~/repo.tar.gz"

          # 2. Copy configuration files to ~/
          scp .env chatbot-service-account-key.json dagster-service-account-key.json docker-compose.yml ${{ secrets.GCE_VM_USER }}@${{ secrets.GCE_VM_HOST }}:~/

          # 3. Archive and copy the repository
          tar -czf /tmp/repo.tar.gz --exclude=.git .
          scp /tmp/repo.tar.gz ${{ secrets.GCE_VM_USER }}@${{ secrets.GCE_VM_HOST }}:~/

      - name: Deploy Cluster on GCE VM
        run: |
          ssh ${{ secrets.GCE_VM_USER }}@${{ secrets.GCE_VM_HOST }} << 'EOF'
            set -e
            
            # Safely source environmental variables even with comments or strings present
            set -a
            source $HOME/.env
            set +a

            # Extract the repository into the home directory so Dagster volume mounts (.:/opt/dagster/app) work
            # Create a `repo` directory and extract the code.
            mkdir -p $HOME/repo
            tar -xzf $HOME/repo.tar.gz -C $HOME/repo
            rm -f $HOME/repo.tar.gz

            # Execute cluster update using files located in $HOME
            sudo docker compose down || true
            sudo docker image prune -a -f

            # Lock down environment and chatbot key to the host user (since Django runs as root and bypasses this)
            chmod 600 $HOME/.env $HOME/chatbot-service-account-key.json

            # Secure the Dagster GCP key: Assign to UID 1000 (Dagster non-root user) and make it read-only
            sudo chown 1000:1000 $HOME/dagster-service-account-key.json
            sudo chmod 400 $HOME/dagster-service-account-key.json

            # Create a persistent directory for Dagster's SQLite database (much faster I/O)
            mkdir -p $HOME/repo/dagster_home
            sudo chown 1000:1000 $HOME/repo/dagster_home

            sudo docker compose pull
            sudo docker compose up -d
          EOF