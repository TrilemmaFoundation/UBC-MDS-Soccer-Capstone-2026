<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Analytics Chatbot</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans">

    <div class="max-w-4xl mx-auto h-screen flex flex-col p-4">
        <header class="py-4 border-b border-gray-700 flex justify-between items-center">
            <h1 class="text-xl font-bold text-green-400">Elite European Football AI</h1>
            <span class="text-xs bg-gray-800 px-2 py-1 rounded text-gray-400">Powered by Groq & BigQuery</span>
        </header>

        <div id="chat-window" class="flex-1 overflow-y-auto my-4 space-y-4 pr-2">
            <div class="flex justify-start">
                <div class="bg-gray-800 p-3 rounded-lg max-w-[80%] border border-gray-700">
                    <p class="text-sm">Hello! Ask me about player archetypes, xG metrics, or match predictions from our StatsBomb dataset.</p>
                </div>
            </div>
        </div>

        <div id="loading-indicator" class="htmx-indicator mb-2 flex items-center space-x-2 text-green-400 text-sm italic">
            <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Querying BigQuery...</span>
        </div>

        <form hx-post="{% url 'ask_chatbot' %}" 
              hx-target="#chat-window" 
              hx-swap="beforeend"
              hx-indicator="#loading-indicator"
              hx-on::after-request="this.reset()"
              class="flex space-x-2 bg-gray-800 p-2 rounded-xl border border-gray-700">
            
            {% csrf_token %}
            <input type="text" name="message" 
                   placeholder="e.g., Which players share Rodri's tactical profile?" 
                   class="flex-1 bg-transparent border-none focus:ring-0 text-sm p-2 outline-none"
                   required>
            
            <button type="submit" onclick="addUserMessage()" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-lg transition text-sm font-semibold">
                Ask AI
            </button>
        </form>
    </div>

    <script>
        function addUserMessage() {
            const input = document.getElementById('user-input');
            const chatWindow = document.getElementById('chat-window');
            if (input.value.trim() !== "") {
                const userHTML = `
                    <div class="flex justify-end">
                        <div class="bg-green-700 p-3 rounded-lg max-w-[80%]">
                            <p class="text-sm">${input.value}</p>
                        </div>
                    </div>`;
                chatWindow.insertAdjacentHTML('beforeend', userHTML);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }
        }
    </script>
</body>
</html>
