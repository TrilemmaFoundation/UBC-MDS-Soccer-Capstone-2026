services:
  django-env:
    image: mdssoccer2026/ubc-mds-soccer-capstone-2026:574964695520740c6819e38ba8a4c54658ad0175
    restart: unless-stopped
    user: "root"
    environment:
      - CHOWN_HOME=yes
      - CHOWN_HOME_OPTS=-R
    ports:
      - "80:8000"
      - "8888:8888"
    volumes:
      - .:/home/jovyan/work
    working_dir: /home/jovyan/work
    deploy:
      resources:
        limits:
          memory: 5G
    platform: linux/arm64

  dagster-env:
    image: mdssoccer2026/ubc-mds-soccer-capstone-2026:574964695520740c6819e38ba8a4c54658ad0175-dagster
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/opt/dagster/app
    working_dir: /opt/dagster/app
    environment:
      - DAGSTER_HOME=/opt/dagster/dagster_home
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-f", "src/dagster/definitions.py"]
    deploy:
      resources:
        limits:
          memory: 3G
    platform: linux/arm64