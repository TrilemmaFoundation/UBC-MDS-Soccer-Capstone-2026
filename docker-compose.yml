services:
  django-env:
    image: mdssoccer2026/ubc-mds-soccer-capstone-2026:53f105b
    ports:
      - "8000:8000"
      - "8888:8888"
    volumes:
      - .:/home/jovyan
    working_dir: /home/jovyan
    deploy:
      resources:
        limits:
          memory: 5G
    platform: linux/arm64

  dagster-env:
    image: mdssoccer2026/ubc-mds-soccer-capstone-2026:latest-dagster
    ports:
      - "3000:3000"
    volumes:
      - .:/opt/dagster/app
    working_dir: /opt/dagster/app
    environment:
      - DAGSTER_HOME=/opt/dagster/dagster_home
    deploy:
      resources:
        limits:
          memory: 3G
    platform: linux/arm64