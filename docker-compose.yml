services:
  django-env:
    image: mdssoccer2026/ubc-mds-soccer-capstone-2026:latest-django
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:8000"
    volumes:
      - ./service-account-key.json:/app/service-account-key.json:ro
    working_dir: /app
    command: ["python", "app/manage.py", "runserver", "0.0.0.0:8000"]
    deploy:
      resources:
        limits:
          memory: 5G
    platform: linux/arm64

  jupyter-env:
    image: mdssoccer2026/ubc-mds-soccer-capstone-2026:latest-jupyter
    restart: unless-stopped
    environment:
      - NB_UID=1000
      - NB_GID=1000
    ports:
      - "8888:8888"
    working_dir: /home/jovyan/work
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser"]
    platform: linux/arm64

  dagster-env:
    image: mdssoccer2026/ubc-mds-soccer-capstone-2026:c65e1308687eb531c258eeb9f8ef3729c19be8cc-dagster
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./src/dagster/definitions.py:/opt/dagster/app/definitions.py:ro
    working_dir: /opt/dagster/app
    environment:
      - DAGSTER_HOME=/opt/dagster/dagster_home
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-f", "definitions.py"]
    deploy:
      resources:
        limits:
          memory: 3G
    platform: linux/arm64