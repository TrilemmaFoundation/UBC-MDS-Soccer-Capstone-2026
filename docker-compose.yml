services:
  django-env:
    image: mdssoccer2026/ubc-mds-soccer-capstone-2026:7a8d447d868cfdd9f7e29609fda2a3ec57d2bde4
    restart: unless-stopped
    # Use the official Jupyter image startup mechanism to safely handle permissions
    user: root
    environment:
      - NB_UID=1000
      - NB_GID=1000
      - CHOWN_HOME=yes
      - CHOWN_HOME_OPTS=-R
      - GRANT_SUDO=yes
    ports:
      - "80:8000"
      - "8888:8888"
    volumes:
      - .:/home/jovyan/work
    working_dir: /home/jovyan/work
    deploy:
      resources:
        limits:
          memory: 5G
    platform: linux/arm64

  dagster-env:
    image: mdssoccer2026/ubc-mds-soccer-capstone-2026:7a8d447d868cfdd9f7e29609fda2a3ec57d2bde4-dagster
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/opt/dagster/app
    working_dir: /opt/dagster/app
    environment:
      - DAGSTER_HOME=/opt/dagster/dagster_home
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-f", "definitions.py"]
    deploy:
      resources:
        limits:
          memory: 3G
    platform: linux/arm64